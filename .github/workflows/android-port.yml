name: Android Port

on:
  push:
    branches: [main]
    paths:
      - 'AndroidPort/**'
      - '.github/workflows/android-port.yml'
      - 'GeneralsMD/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: AndroidPort
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Android port APK
        uses: actions/upload-artifact@v4
        with:
          name: NewShoes-Android-Port-debug
          path: AndroidPort/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
